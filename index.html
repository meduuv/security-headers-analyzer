<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Headers Analyzer</title><style>:root{color-scheme:dark}body{margin:0;background:#090909;color:#eee;font:15px system-ui}main{max-width:1000px;margin:40px auto;padding:20px}textarea{width:100%;height:330px;background:#111;color:#eee;border:1px solid #292929;border-radius:12px;padding:14px;font:13px monospace;box-sizing:border-box}button{margin:10px 0;padding:10px 15px;border:0;border-radius:9px;font-weight:700}.cards{display:grid;gap:9px}.card{padding:13px;border:1px solid #292929;border-radius:11px;background:#111}.ok{border-color:#295637}.bad{border-color:#632c2c}.warn{border-color:#5b481f}.muted{color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>Security Headers Analyzer</h1><p class="muted">Paste raw HTTP response headers. Analysis stays local.</p><div class="grid"><div><textarea id="i" placeholder="HTTP/1.1 200 OK\nContent-Security-Policy: default-src 'self'\nStrict-Transport-Security: max-age=31536000"></textarea><button onclick="go()">Analyze</button></div><div id="o" class="cards"><div class="card">No analysis yet.</div></div></div><p class="muted">by guns.lol/meduu</p><script>const C=[['Strict-Transport-Security','HSTS reduces downgrade and cookie-stripping attacks.','bad'],['Content-Security-Policy','CSP restricts executable/content sources and can reduce XSS impact.','bad'],['X-Content-Type-Options','nosniff prevents MIME-type sniffing.','warn'],['Referrer-Policy','Limits referrer information sent across origins.','warn'],['Permissions-Policy','Restricts browser features such as camera and microphone.','warn'],['X-Frame-Options','Helps mitigate framing-based clickjacking.','warn']];function go(){let m={};for(let l of i.value.split(/\r?\n/)){let p=l.indexOf(':');if(p>0)m[l.slice(0,p).trim().toLowerCase()]=l.slice(p+1).trim()}o.innerHTML='';let n=0;for(let [h,w,s] of C){let v=m[h.toLowerCase()],d=document.createElement('div');d.className='card '+(v?'ok':s);d.innerHTML='<b>'+h+'</b><div class="muted">'+(v?'Present: '+safe(v):'Missing — '+w)+'</div>';o.appendChild(d);if(v)n++}let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+n+'/'+C.length+'</b> recommended headers detected';o.prepend(d)}function safe(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}</script><!-- by guns.lol/meduu -->
